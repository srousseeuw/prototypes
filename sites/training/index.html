<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7c207c">
<title>U7 Trainingsplanner</title>
<style>
:root{
  --pitch:#7c207c; --pitch-2:#9a2f9a; --pitch-3:#5b165b; --line:#ffffff; /* clubkleuren KSV Wildert: paars en wit (paars uit het logo) */
  --cone:#ff7a1a; --yellow:#ffd23f; --blue:#2f6fdb; --coral:#e5484d; --purple:#0f8b8d; --green:#2a8a4a;
  --ink:#241a2a; --muted:#6b5f70; --bg:#f6f2f7; --card:#ffffff; --edge:#e3d8e5;
  --radius:14px; --shadow:0 1px 2px rgba(60,20,60,.08),0 4px 14px rgba(60,20,60,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--pitch)}
h1,h2,h3{margin:0;line-height:1.2}
.sr{position:absolute;left:-9999px}

/* ---------- top bar ---------- */
.top{background:var(--pitch);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top .in{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:800;letter-spacing:.2px;flex:1;min-width:0}
.top .brand .ball{width:30px;height:30px;border-radius:50%;background:#fff;position:relative;flex:none;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12)}
.top .brand .ball:after{content:"";position:absolute;inset:8px;background:var(--pitch);clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%)}
.top .brand small{display:block;font-weight:500;font-size:12px;opacity:.85}
.top .brand span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{display:flex;gap:4px}
.top nav a,.top nav button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 11px;text-decoration:none;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.top nav a.active{background:#fff;color:var(--pitch)}
@media(max-width:560px){.top .brand span{display:none}.top .brand{flex:0 0 auto}.top nav{flex:1;justify-content:flex-end}}
.lines{position:absolute;inset:0;pointer-events:none;opacity:.12;background:
 radial-gradient(circle at 50% 50%, transparent 46px, #fff 46px, #fff 48px, transparent 48px),
 linear-gradient(#fff,#fff) center/2px 100% no-repeat;}

main{max-width:900px;margin:0 auto;padding:16px 14px 120px}
.wrap-print{display:none}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{border:1px solid var(--edge);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:#fff}
.btn.cone{background:var(--cone);border-color:var(--cone);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pitch)}
.btn.danger{color:var(--coral)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px;border-radius:10px}
.btn.icon{width:44px;padding:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--edge);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;font-weight:500;color:var(--ink);min-height:44px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--pitch-2);outline-offset:1px;border-color:var(--pitch-2)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;color:#fff;background:var(--muted);white-space:nowrap}
.badge.warm{background:var(--cone)}.badge.fit{background:#d9a400}.badge.dribbel{background:var(--green)}.badge.schiet{background:var(--coral)}.badge.v1{background:var(--blue)}.badge.partij{background:var(--purple)}.badge.overig{background:#7b8a80}
.badge.eigen{background:#fff;color:var(--pitch);border:1px solid var(--pitch)}
.warn{color:var(--coral)!important}
.warnnote{display:block;color:var(--coral);font-size:12px;font-weight:700}
.exrow.bad .t b{color:var(--coral)}
.exrow.bad .cat{opacity:.4}
.matcard{padding:12px 14px;margin-top:10px}
.matcard h2{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.mat{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mat span{background:var(--bg);border-radius:8px;padding:5px 10px;font-weight:600;font-size:14px}
.mat span b{color:var(--pitch);margin-right:3px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:60;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--coral)}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h1{font-size:22px;flex:1;min-width:0}
.status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:#9ab3a0;display:inline-block}
.status.saving i{background:var(--yellow)}.status.ok i{background:var(--pitch-2)}.status.err i{background:var(--coral)}

/* ---------- home list ---------- */
.tlist{display:grid;gap:10px}
.titem{display:flex;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit}
.titem .date{flex:none;width:58px;text-align:center;background:var(--bg);border-radius:10px;padding:6px 4px;line-height:1.1}
.titem .date b{display:block;font-size:20px}
.titem .date span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}
.titem h3{font-size:16px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .chev{color:var(--muted);font-size:22px}
.minutes{font-weight:800;color:var(--pitch)}
.minutes.over{color:var(--coral)}

/* ---------- editor ---------- */
.head{padding:14px;display:grid;gap:10px}
.head .title{font-size:20px;font-weight:800;border:0;border-bottom:2px dashed var(--edge);padding:6px 2px;background:transparent;width:100%;min-height:44px}
.head .title:focus{outline:0;border-bottom-color:var(--pitch-2)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.timeline{margin-top:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.block{display:flex;gap:0;overflow:hidden;position:relative;transition:box-shadow .15s}
.block.dragging{opacity:.75;box-shadow:0 10px 24px rgba(0,0,0,.2);z-index:5}
.block .tcol{flex:none;width:64px;background:var(--pitch);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;text-align:center}
.block .tcol b{font-size:15px;line-height:1.1}
.block .tcol span{font-size:11px;opacity:.85}
.block .tcol .handle{margin-top:6px;width:36px;height:30px;border-radius:8px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;font-size:18px;letter-spacing:1px}
.block .body{flex:1;min-width:0;padding:10px 12px;display:grid;gap:8px}
.block .name{display:flex;align-items:flex-start;gap:8px}
.block .name h3{font-size:17px;flex:1;min-width:0;cursor:pointer}
.block .name h3 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.block .ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dur{display:inline-flex;align-items:center;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:#fff}
.dur button{border:0;background:transparent;width:38px;height:40px;font-size:20px;font-weight:700;color:var(--pitch)}
.dur input{width:48px;border:0;text-align:center;font-weight:800;font-size:16px;-moz-appearance:textfield;height:40px}
.dur input::-webkit-inner-spin-button{-webkit-appearance:none}
.dur span{padding-right:8px;color:var(--muted);font-size:13px}
.coach{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);border-radius:10px;padding:0 8px;height:40px;background:#fff;max-width:100%}
.coach select{border:0;background:transparent;font-weight:600;max-width:150px;height:38px}
.coach .ico{color:var(--muted)}
.mini{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--edge);background:#fff;font-size:16px}
.mini.del{color:var(--coral)}
.stations{display:grid;gap:6px;border-left:3px solid var(--purple);padding-left:10px}
.station{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.station .lbl{flex:none;width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.station .sname{flex:1;min-width:140px;font-weight:600;cursor:pointer;text-align:left;background:transparent;border:0;padding:4px 0}
.station .sname.empty{color:var(--muted);font-weight:500;font-style:italic}
.note{border:1px dashed var(--edge);border-radius:10px;padding:8px 10px;font-size:14px;width:100%;background:#fbfdfb;min-height:38px;resize:vertical}
.note:focus{outline:2px solid var(--pitch-2)}
.rot{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rot input{width:18px;height:18px}
.addrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.sumbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--edge);padding:8px 14px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.sumbar .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sumbar .bar{flex:1;min-width:0}
.sumbar .bar .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.sumbar .track{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}
.sumbar .fill{height:100%;background:var(--pitch-2);width:0;transition:width .2s}
.sumbar .fill.over{background:var(--coral)}
.sumbar .fill.near{background:var(--cone)}

/* ---------- sheet (modal / bottom sheet) ---------- */
.veil{position:fixed;inset:0;background:rgba(10,30,18,.45);z-index:40;display:none}
.veil.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:#fff;border-radius:18px 18px 0 0;z-index:50;display:none;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.open{display:flex}
.sheet .sh{padding:12px 16px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:10px}
.sheet .sh h2{font-size:18px;flex:1}
.sheet .sh:before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--edge);transform:translateX(-50%)}
.sheet .sb{overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet .sf{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--edge);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media(min-width:720px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:640px;max-height:86vh;border-radius:18px}.sheet .sh:before{display:none}}
.chips{display:flex;gap:6px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--edge);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;min-height:36px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{width:100%;border:1px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;margin-bottom:8px}
.exlist{display:grid;gap:8px}
.exrow{display:flex;gap:10px;align-items:center;padding:10px 12px;text-align:left;width:100%;background:#fff;cursor:pointer}
.exrow .cat{flex:none;width:10px;align-self:stretch;border-radius:6px;background:var(--muted)}
.exrow .cat.warm{background:var(--cone)}.exrow .cat.fit{background:#d9a400}.exrow .cat.dribbel{background:var(--green)}.exrow .cat.schiet{background:var(--coral)}.exrow .cat.v1{background:var(--blue)}.exrow .cat.partij{background:var(--purple)}.exrow .cat.overig{background:#7b8a80}
.exrow .t{flex:1;min-width:0}
.exrow .t b{display:block;font-size:15px}
.exrow .t span{font-size:13px;color:var(--muted)}
.exrow .info{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:#fff;font-weight:800;color:var(--pitch)}
.detail h3{font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:14px 0 4px}
.detail ul{margin:0;padding-left:20px}
.detail li{margin:3px 0}
.detail .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.detail .meta span{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- library page ---------- */
.libgrid{display:grid;gap:8px}

/* ---------- overview / print ---------- */
.ov{padding:16px}
.ov h1{font-size:22px}
.ov table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.ov th,.ov td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--edge);vertical-align:top}
.ov th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.3px}
.ov td.t{white-space:nowrap;font-weight:700;color:var(--pitch)}
.ov .st{display:block;padding-left:10px;border-left:2px solid var(--purple);margin:2px 0}
.ov .st b{color:var(--purple)}
.ov .exd{margin-top:18px;page-break-inside:avoid;border-top:1px solid var(--edge);padding-top:10px}
.ov .exd h3{font-size:15px}
.ov .exd ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.ov .exd p{margin:4px 0;font-size:13px;color:var(--muted)}
@media print{
  body{background:#fff;padding:0}
  .top,.sumbar,.noprint,.toast{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:0}
  .ov{padding:0}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="lines"></div>
  <div class="in">
    <a class="brand" href="#/"><i class="ball"></i><span id="brandTxt">U7 Trainingsplanner<small id="brandSub">KSV Wildert</small></span></a>
    <nav>
      <a href="#/" id="navHome">Training</a>
      <a href="#/oefeningen" id="navLib">Oefeningen</a>
      <button type="button" id="navSettings" title="Instellingen" aria-label="Instellingen">⚙︎</button>
    </nav>
  </div>
</header>
<main id="app"><div class="empty"><div class="big">⚽</div>Laden…</div></main>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   OEFENINGENBANK — U7 (6-jarigen), kwartveld, 10 à 15 spelers, 3 trainers.
   Geïnspireerd op de oefenstof van KNVB Rinus (rinus.knvb.nl), in eigen
   woorden herschreven en ingekort tot wat je op het veld nodig hebt.
   dur = realistische duur in minuten incl. uitleg, players = [min, max].
   ===================================================================== */
const CATS = {
  warm:  {label:'Warming-up & tikspel', short:'Warming-up'},
  fit:   {label:'Voetbalfit (kracht, balans, springen)', short:'Voetbalfit'},
  dribbel:{label:'Dribbelen', short:'Dribbelen'},
  schiet:{label:'Schieten & mikken', short:'Schieten'},
  v1:    {label:'1 tegen 1', short:'1 tegen 1'},
  partij:{label:'Partijvormen', short:'Partij'},
  overig:{label:'Pauze & organisatie', short:'Overig'},
};
const RINUS = id => 'https://rinus.knvb.nl/nl/exercise/id/' + id;
const LIB = [
/* ---- warming-up & tikspelen ---- */
{id:'welkom',cat:'overig',name:'Verwelkoming in de kring',dur:3,players:[4,20],org:'Iedereen in een kring rond de trainer.',desc:['Kort overlopen wat we vandaag gaan doen (2 of 3 dingen, niet meer).','Vraag wie er een goede week had of iets wil vertellen: 1 minuut.','Afspraak herhalen: fluitsignaal = stoppen met voet op de bal.'],mat:'—'},
{id:'vliegtuigen',cat:'warm',name:'Vliegtuigen (fantasiespel)',dur:5,players:[4,16],org:'Vak van ±25×15 m, zonder bal.',desc:['Vertel een kort avontuur: de kinderen zijn vliegtuigen die door het vak vliegen.','Bij een fluitsignaal landen ze (stilstaan), bij het volgende stijgen ze weer op.','Wie buiten het vak vliegt: even stoppen en samen kijken waar het vak stopt.','Ideale allereerste minuten: iedereen beweegt meteen, geen uitleg nodig.'],mat:'8 hoedjes',rinus:36523},
{id:'stadion',cat:'warm',name:'Stadionspel',dur:8,players:[6,16],org:'Groot vak met in elke hoek een klein vak (een "stadion"). Geef elk stadion een naam die de kinderen kennen.',desc:['Iedereen dribbelt met een eigen bal. De trainer roept een stadion, iedereen dribbelt er samen naartoe.','Wissel af: traag, snel, met de andere voet, stoppen op fluitsignaal.','Laat af en toe een kind het volgende stadion kiezen.'],mat:'1 bal per kind, 16 hoedjes',easier:'Stadions dichter bij elkaar.',harder:'Twee stadions na elkaar roepen, of een tikker toevoegen.',rinus:36629},
{id:'dribbeltik',cat:'warm',name:'Dribbeltikkertje',dur:8,players:[6,15],org:'Vak van ±15×12 m. Iedereen heeft een bal, de tikkers dragen een hesje.',desc:['Twee tikkers dribbelen mee met hun bal en proberen in 45 seconden zoveel mogelijk spelers te tikken.','Wie met zijn bal buiten het vak gaat, is ook een punt voor de tikkers.','Na elke ronde twee nieuwe tikkers. Welk duo haalt de meeste punten?'],mat:'1 bal per kind, 4 hoedjes, 2 hesjes',easier:'Kleiner vak, of tikkers zonder bal.',harder:'Groter vak.',rinus:33893},
{id:'slangentik',cat:'warm',name:'Slangentikkertje',dur:6,players:[6,15],org:'Vak van ±15×15 m. Iedereen dribbelt, één slang zonder bal.',desc:['De slang probeert dribbelaars te tikken. Wie getikt is, legt zijn bal opzij en geeft de slang een hand.','Zo groeit de slang; de spelers aan de uiteinden mogen tikken.','Ronde stopt na 90 seconden of als iedereen aan de slang hangt. Nieuwe slang.'],mat:'1 bal per kind, 8 hoedjes, 1 hesje',easier:'Start met twee aparte slangen.',harder:'Groter vak.',rinus:1485105},
{id:'poorttik',cat:'warm',name:'Poorttikkertje',dur:6,players:[6,15],org:'Vak van ±15×15 m, één tikker met hesje.',desc:['Wie getikt wordt, gaat met de benen wijd staan (een poortje).','Vrije spelers bevrijden door tussen de benen door te kruipen.','Wissel de tikker na 1 minuut. Haalt de tikker iedereen? Dan wint de tikker.'],mat:'8 hoedjes, 1 hesje',easier:'Extra tikker.',harder:'Iedereen dribbelt met een bal; bevrijden = bal door het poortje passen.',rinus:47421},
{id:'lionking',cat:'warm',name:'Lion King (leeuwenkuil)',dur:10,players:[8,14],org:'Vak van ±20×15 m met in één hoek een klein vakje: de leeuwenkuil. Iedereen heeft een bal, behalve twee leeuwen.',desc:['Eén leeuw jaagt 45 seconden en tikt dribbelaars. Wie getikt is, brengt zijn bal naar de leeuwenkuil.','De tweede leeuw bewaakt de kuil. Getikte spelers mogen hun bal terug stelen: er ongetikt mee uitdribbelen.','Wie na de ronde de meeste ballen heeft veroverd, is de Lion King. Nieuwe leeuwen.'],mat:'1 bal per kind, 12 hoedjes, 2 hesjes',easier:'Kleiner vak, kleinere kuil.',harder:'Groter vak.',rinus:36011},

{id:'katmuis',cat:'warm',name:'Hesjes roven (kat en muis)',dur:5,players:[6,15],org:'Vak van ±15×15 m. Iedereen steekt een hesje achteraan in de broek.',desc:['Iedereen probeert bij elkaar het hesje uit de broek te trekken: 1 punt per hesje.','Je mag je hesje niet met de handen beschermen. Hesje kwijt? Buiten het vak opnieuw insteken en verder spelen.','Wie heeft er eerst 5 hesjes gepakt?'],mat:'1 hesje per kind, 8 hoedjes',harder:'Iedereen dribbelt ondertussen met een bal.',rinus:1485830},
{id:'hertenwolf',cat:'warm',name:'Herten en wolf',dur:10,players:[5,10],org:'Startlijn, een schietvak op ±6 m van twee kleine doeltjes. De wolf staat tussen schietvak en doeltjes.',desc:['De herten dribbelen naar het schietvak en schieten van daaruit op een van de twee doeltjes.','De wolf mag stoppen met handen en voeten en speelt de bal daarna opzij.','Na het schot: bal halen en via de zijkant terug naar de start. Wissel de wolf na 1 minuut.'],mat:'1 bal per kind, 2 kleine doeltjes, 12 hoedjes, 1 hesje',easier:'Schietvak verder weg, doeltjes dichter bij elkaar.',harder:'Schietvak dichter bij, doeltjes verder uit elkaar.',rinus:1478981},

{id:'tikrugby',cat:'fit',name:'Tik-rugby',dur:8,players:[8,15],org:'Veld van ±25×15 m met aan beide kanten een eindvak van 3 m. Twee teams.',desc:['Scoren = met de bal in de handen in het eindvak van de tegenpartij lopen.','Je mag lopen met de bal of gooien. Word je getikt met bal in de hand? Bal voor de ander.','Bal op de grond? Ook voor de tegenpartij.'],mat:'1 bal, 12 hoedjes, hesjes',easier:'Groter veld.',harder:'Enkel achterwaarts gooien.',rinus:47415},

{id:'slalom',cat:'dribbel',name:'Dribbelslalom',dur:8,players:[4,12],org:'Per groepje van 3 à 4 een slalom van 6 hoedjes. Zet meerdere slaloms naast elkaar.',desc:['Dribbel om de hoedjes en sluit achteraan aan. De volgende start als de vorige voorbij het laatste hoedje is.','Maak er een estafette van: welk groepje is het eerst rond?','Variatie: enkel linkervoet, enkel buitenkant voet.'],mat:'1 bal per kind, 12 hoedjes',easier:'Hoedjes dichter bij elkaar.',harder:'Hoedjes verder uit elkaar, of met het "verkeerde" been.',rinus:39699},

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const API = '/api/training';
const state = { lib: {version:0, exercises:[], trainers:[], settings:{}}, list:null, t:null, tid:null, dirty:false, saving:false, pendingSave:false, poll:null, tab:'', q:'' };

const NL_DAYS = ['zo','ma','di','wo','do','vr','za'];
const NL_MONTHS = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function fmtDate(iso){ if(!iso) return {d:'—',m:'',w:''}; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return {d:'—',m:'',w:''}; return {d:d.getDate(), m:NL_MONTHS[d.getMonth()], w:NL_DAYS[d.getDay()]}; }
function fmtDateLong(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'][d.getDay()]+' '+d.getDate()+' '+['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'][d.getMonth()]+' '+d.getFullYear(); }
function addMin(hhmm, min){ const [h,m]=hhmm.split(':').map(Number); const t=h*60+m+min; return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }

let toastTimer;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast',2600); }

async function api(path, opt={}){
  const r = await fetch(API+path, {headers:{'content-type':'application/json'}, ...opt, body: opt.body!==undefined ? JSON.stringify(opt.body) : undefined});
  const data = await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error(data.error||('HTTP '+r.status)); e.status=r.status; e.data=data; throw e; }
  return data;
}

/* ---------- oefeningen ---------- */
function allEx(){ return LIB.concat(state.lib.exercises||[]); }
function getEx(id){ return allEx().find(e=>e.id===id); }
function exName(item){ if(!item) return ''; if(item.title) return item.title; const e=getEx(item.ex); return e?e.name:'(oefening verwijderd)'; }
function trainers(){ return (state.lib.trainers||[]).filter(Boolean); }

/* ---------- past de oefening bij dit aantal spelers? ---------- */
function fits(e, n){
  if(!e||!e.players||!n) return null;
  if(n<e.players[0]) return 'te weinig spelers (minstens '+e.players[0]+')';
  if(n>e.players[1]) return 'te veel spelers (hoogstens '+e.players[1]+')';
  return null;
}
function playersFor(block, t){ const n=Number(t.players)||0; return block.kind==='stations'&&block.items.length?Math.ceil(n/block.items.length):n; }

/* ---------- materiaal afleiden uit de oefeningen ----------
   De materiaalvelden zijn vrije tekst ("1 bal per kind, 8 hoedjes, 2 kleine
   doeltjes"). We lezen aantal + soort, rekenen "per kind/duo/groepje" om naar
   het aantal spelers, tellen stations (gelijktijdig) op en nemen over de
   onderdelen heen (na elkaar) het maximum. Een schatting, geen inventaris. */
const MAT_KEYS=[[/\bbal(len)?\b/,'ballen'],[/hoedje|kegel/,'hoedjes'],[/\bpion/,'pionnen'],[/klein(e)? doel/,'kleine doeltjes'],[/pupillendoel|groot doel|grote doelen/,'pupillendoelen'],[/hesje/,'hesjes']];
const MAT_ORDER=['ballen','hoedjes','pionnen','kleine doeltjes','pupillendoelen','hesjes'];
function parseMat(mat, n){
  const out={}; if(!mat||/^[—\-\s]*$/.test(mat)) return out;
  mat.split(/,|;/).forEach(tok=>{
    tok=tok.trim().toLowerCase(); if(!tok) return;
    const m=tok.match(/^(\d+)(?:\s*(?:à|a|-|–|tot)\s*(\d+))?\s*(.*)$/);
    let qty=m?Number(m[2]||m[1]):null, name=m?m[3]:tok, per=1;
    if(/per kind|per speler/.test(name)) per=n;
    else if(/per duo|per tweetal/.test(name)) per=Math.ceil(n/2);
    else if(/per groepje|per team|per drietal/.test(name)) per=Math.ceil(n/3);
    else if(/per veldje|per plus|per station|per slalom|per parcours/.test(name)) per=Math.max(1,Math.ceil(n/4));
    let key=null; for(const [re,k] of MAT_KEYS){ if(re.test(name)){ key=k; break; } }
    if(!key) key=name.replace(/\bper .*$/,'').replace(/\(.*?\)/g,'').trim()||'materiaal';
    if(qty===null){ qty={ballen:Math.max(4,Math.ceil(n/2)),hesjes:n,hoedjes:8,pionnen:6,'kleine doeltjes':2,pupillendoelen:1}[key]||1; per=1; }
    if(/helft/.test(name)){ qty=Math.ceil(n/2); per=1; }
    out[key]=(out[key]||0)+qty*per;
  });
  return out;
}
function materialsFor(t){
  const need={};
  (t.blocks||[]).forEach(b=>{
    const n=playersFor(b,t); const blk={};
    b.items.forEach(it=>{ const e=it.ex&&getEx(it.ex); if(!e) return; const m=parseMat(e.mat,n); for(const k in m) blk[k]=(blk[k]||0)+m[k]; });
    for(const k in blk) need[k]=Math.max(need[k]||0,blk[k]);
  });
  const keys=Object.keys(need).sort((a,b)=>{ const ia=MAT_ORDER.indexOf(a), ib=MAT_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b); });
  return keys.map(k=>({key:k, qty:need[k]}));
}
function matHtml(t){ const list=materialsFor(t); if(!list.length) return '<span class="muted small">Nog geen oefeningen gekozen.</span>'; return `<div class="mat">${list.map(m=>`<span><b>${m.qty}</b>${esc(m.key)}</span>`).join('')}</div>`; }

/* ---------- bibliotheek opslaan ---------- */
let libSaveTimer;
async function saveLib(){
  clearTimeout(libSaveTimer);
  try{
    const r = await api('/library',{method:'PUT',body:{baseVersion:state.lib.version, exercises:state.lib.exercises, trainers:state.lib.trainers, settings:state.lib.settings}});
    state.lib = r;
  }catch(e){
    if(e.status===409){ state.lib=e.data.current; toast('Bibliotheek was intussen aangepast, opnieuw geladen',true); render(); }
    else toast('Opslaan mislukt: '+e.message,true);
  }
}

/* ---------- training opslaan (debounce + optimistic lock) ---------- */
let saveTimer;
function setStatus(cls, txt){ const s=$('#saveStatus'); if(s){ s.className='status '+cls; s.lastChild.textContent=txt; } }
function mutate(fn, opts={}){
  if(!state.t) return;
  fn(state.t);
  state.dirty=true;
  if(!opts.noRender) render(); else renderSummary();
  setStatus('saving','wijzigingen…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveTraining, 700);
}
async function saveTraining(){
  if(!state.t||!state.tid) return;
  if(state.saving){ state.pendingSave=true; return; }
  state.saving=true; state.dirty=false;
  const {id, version, updatedAt, ...doc} = state.t;
  try{
    const r = await api('/trainings/'+state.tid,{method:'PUT',body:{baseVersion:state.t.version||0, doc}});
    state.t.version=r.version; state.t.updatedAt=r.updatedAt;
    setStatus('ok','opgeslagen');
  }catch(e){
    if(e.status===409){
      state.t=e.data.current; state.dirty=false;
      toast('Iemand anders heeft deze training net aangepast. Nieuwste versie geladen.',true);
      render();
    }else{ setStatus('err','niet opgeslagen'); toast('Opslaan mislukt: '+e.message,true); state.dirty=true; }
  }finally{
    state.saving=false;
    if(state.pendingSave||state.dirty){ state.pendingSave=false; saveTraining(); }
  }
}
function startPoll(){
  stopPoll();
  state.poll=setInterval(async()=>{
    if(!state.tid||state.dirty||state.saving||document.hidden) return;
    const a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    try{ const r=await api('/trainings/'+state.tid); if(r.version!==state.t.version){ state.t=r; render(); toast('Training bijgewerkt door een collega'); } }catch(e){}
  }, 12000);
}
function stopPoll(){ if(state.poll){ clearInterval(state.poll); state.poll=null; } }

/* ---------- sjablonen ---------- */
/* Eén training: het dashboard toont altijd de eerstvolgende trainingsdag
   (uit de instellingen). Is die dag voorbij (na het einduur), dan schuift
   het automatisch een week op; de inhoud blijft staan om aan te passen. */
const CURRENT_ID='huidige';
function nextTraining(){
  const s=state.lib.settings||{};
  const time=s.defaultTime||'';
  const target=(state.t&&Number(state.t.target))||s.defaultTarget||60;
  const now=new Date(); const d=new Date(now); d.setHours(12,0,0,0);
  const hasWd=s.defaultWeekday!==undefined&&s.defaultWeekday!==''&&s.defaultWeekday!==null;
  if(hasWd){
    const wd=Number(s.defaultWeekday); d.setDate(d.getDate()+((wd-now.getDay()+7)%7));
    if(d.toDateString()===now.toDateString()&&time){ const [h,m]=time.split(':').map(Number); const end=new Date(now); end.setHours(h,m+target,0,0); if(now>end) d.setDate(d.getDate()+7); }
  }
  const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return {date:hasWd?iso:'', time, end:time?addMin(time,target):'', label:(hasWd?fmtDateLong(iso):'Volgende training')+(time?' · '+time+(time?'–'+addMin(time,target):''):'')};
}
function blankTraining(){
  const s=state.lib.settings||{};
  return {title:'', players: s.defaultPlayers||12, target: s.defaultTarget||60, notes:'', blocks:[]};
}
function single(ex, coach, dur){ const e=getEx(ex); return {id:uid(), kind:'single', duration:dur||(e?e.dur:10), items:[{ex, coach:coach||''}], note:''}; }
function stationsBlock(exIds, dur){ return {id:uid(), kind:'stations', duration:dur, rotate:true, items:exIds.map(ex=>({ex, coach:''})), note:''}; }
function templateStandard(){
  const t=blankTraining(); const tr=trainers();
  t.title='Training U7';
  t.blocks=[
    single('welkom', tr[0], 3),
    single('dribbeltik', tr[0], 8),
    single('chinees', tr[1], 5),
    stationsBlock(['oversteek1','doelschietkeeper','v1doeltjes'], 24),
    single('drink', '', 3),
    single('p4v4', tr[2]||tr[0], 14),
    single('afsluiting', tr[0], 3),
  ];
  t.blocks[3].items.forEach((it,i)=>it.coach=tr[i]||'');
  return t;
}

/* ---------- router ---------- */
window.addEventListener('hashchange', route);
async function route(){
  const h=location.hash||'#/';
  const lib=h.startsWith('#/oefeningen');
  $('#navHome').classList.toggle('active',!lib); $('#navLib').classList.toggle('active',lib);
  closeSheet();
  if(h.startsWith('#/oefeningen')){ stopPoll(); state.view='lib'; render(); return; }
  state.view=h.startsWith('#/print')?'print':'edit';
  if(!state.t){
    state.tid=CURRENT_ID; render();
    try{ state.t=await api('/trainings/'+CURRENT_ID); }
    catch(e){
      if(e.status!==404){ toast('Training laden mislukt: '+e.message,true); return; }
      // Nog geen training in de opslag: start met de standaardopbouw.
      try{ state.t=await api('/trainings/'+CURRENT_ID,{method:'PUT',body:{doc:templateStandard()}}); }
      catch(e2){ toast('Aanmaken mislukt: '+e2.message,true); return; }
    }
  }
  render(); startPoll();
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  const s=state.lib.settings||{};
  $('#brandSub').textContent = s.club ? s.club+' · U7' : 'KSV Wildert';
  if(state.view==='lib') return renderLib(app);

}

function totals(t){ return (t.blocks||[]).reduce((s,b)=>s+(Number(b.duration)||0),0); }

function renderSummary(){
  const t=state.t; if(!t) return;
  const tot=totals(t), target=Number(t.target)||60;
  const el=$('#sumMin'); if(el){ el.textContent=tot+' / '+target+' min'; el.className='minutes'+(tot>target?' over':''); }
  const fill=$('#sumFill'); if(fill){ fill.style.width=Math.min(100,tot/target*100)+'%'; fill.className='fill'+(tot>target?' over':(tot<target&&tot>=target-3)?' near':''); }
  const rest=$('#sumRest'); if(rest) rest.textContent= tot>target ? (tot-target)+' min te veel' : tot===target ? 'perfect op tijd' : (target-tot)+' min over';
  // starttijden
  const time=nextTraining().time;
  let cur=0; document.querySelectorAll('.block').forEach(el=>{ const b=t.blocks.find(x=>x.id===el.dataset.id); if(!b) return; const tc=el.querySelector('.tcol b'); const ts=el.querySelector('.tcol span'); if(tc) tc.textContent=time?addMin(time,cur):(cur+"'"); if(ts) ts.textContent=(b.duration||0)+' min'; cur+=Number(b.duration)||0; });
}

function coachSelect(val, attrs){
  const tr=trainers();
  const opts=['<option value="">— wie legt uit?</option>'].concat(tr.map(n=>`<option value="${esc(n)}"${n===val?' selected':''}>${esc(n)}</option>`));
  if(val&&!tr.includes(val)) opts.push(`<option value="${esc(val)}" selected>${esc(val)}</option>`);
  return `<label class="coach"><span class="ico">🗣</span><select ${attrs}>${opts.join('')}</select></label>`;
}

  <div class="card head">
    <input class="title" placeholder="Thema van deze training (bv. Dribbelen & scoren)" value="${esc(t.title||'')}" data-f="title">
    <label class="field" style="max-width:220px">Aantal spelers<input type="number" inputmode="numeric" min="1" max="30" value="${esc(t.players||'')}" data-f="players"></label>

  <div class="card matcard"><h2>Materiaal klaarzetten</h2>${matHtml(t)}<div class="small muted" style="margin-top:6px">Geschat uit de gekozen oefeningen voor ${t.players||0} spelers; stations tellen samen, onderdelen na elkaar delen het materiaal.</div></div>

  const addS=()=>openPicker(ex=>mutate(t=>{ t.blocks.push(single(ex.id, '', ex.dur)); }), Number(t.players)||0);

function autosize(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; }

/* ---------- drag & drop (pointer events: werkt met muis en vinger) ---------- */
function initDrag(){
  const tl=$('#timeline'); if(!tl) return;
  let drag=null;
  tl.querySelectorAll('.handle').forEach(h=>{
    h.addEventListener('pointerdown',e=>{
      const el=h.closest('.block'); drag={el, y:e.clientY}; el.classList.add('dragging'); h.setPointerCapture(e.pointerId); e.preventDefault();
    });
    h.addEventListener('pointermove',e=>{
      if(!drag) return;
      const els=document.elementsFromPoint(e.clientX,e.clientY); const over=els.map(x=>x.closest&&x.closest('.block')).find(x=>x&&x!==drag.el); if(!over) return;
      const r=over.getBoundingClientRect(); const before=e.clientY<r.top+r.height/2;
      if(before) tl.insertBefore(drag.el,over); else tl.insertBefore(drag.el,over.nextSibling);
      // scroll bij randen
      if(e.clientY<80) window.scrollBy(0,-8); else if(e.clientY>window.innerHeight-120) window.scrollBy(0,8);
    });
    const end=()=>{ if(!drag) return; drag.el.classList.remove('dragging'); const order=[...tl.querySelectorAll('.block')].map(x=>x.dataset.id); drag=null; const cur=state.t.blocks.map(b=>b.id).join(); if(order.join()!==cur) mutate(t=>{ t.blocks=order.map(id=>t.blocks.find(b=>b.id===id)); }); };
    h.addEventListener('pointerup',end); h.addEventListener('pointercancel',end);
  });
}

/* ---------- oefening kiezen ---------- */
function exRow(e, extra, n){ const w=fits(e,n); return `<div class="card exrow${w?' bad':''}" role="button" tabindex="0" data-ex="${esc(e.id)}"><div class="cat ${e.cat}"></div><div class="t"><b>${esc(e.name)}${e.custom?' <span class="badge eigen">eigen</span>':''}</b><span>${esc(CATS[e.cat]?CATS[e.cat].short:e.cat)} · ${e.dur} min · ${e.players?e.players[0]+'–'+e.players[1]:'?'} spelers</span>${w?`<span class="warnnote">⚠ ${esc(w)}</span>`:''}</div>${extra||''}</div>`; }
function filterEx(){
  const q=state.q.trim().toLowerCase();
  return allEx().filter(e=>(!state.tab||e.cat===state.tab)&&(!q||(e.name+' '+(e.desc||[]).join(' ')+' '+(e.org||'')).toLowerCase().includes(q)));
}
function openPicker(onPick, n){
  const chips=`<div class="chips"><button class="chip${!state.tab?' on':''}" data-tab="">Alles</button>${Object.entries(CATS).map(([k,v])=>`<button class="chip${state.tab===k?' on':''}" data-tab="${k}">${v.short}</button>`).join('')}</div>`;
  sheet(`<h2>Oefening kiezen${n?` <span class="muted small" style="font-weight:500">voor ${n} spelers</span>`:''}</h2>`,`<input class="search" id="exq" placeholder="Zoek (bv. tikkertje, doeltjes, 1 tegen 1)…" value="${esc(state.q)}">${chips}<div class="exlist" id="exlist"></div>`,
    `<button class="btn" id="newCustom">＋ Eigen oefening schrijven</button>`);
  const draw=()=>{ const list=filterEx(); $('#exlist').innerHTML=list.map(e=>exRow(e,`<button class="info" data-info="${esc(e.id)}" aria-label="Details">i</button>`,n)).join('')||'<div class="empty">Niets gevonden.</div>';
    $('#exlist').querySelectorAll('[data-ex]').forEach(b=>b.onclick=ev=>{ if(ev.target.closest('[data-info]')) return; const e=getEx(b.dataset.ex); closeSheet(); onPick(e); });
    $('#exlist').querySelectorAll('[data-info]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); openDetail(getEx(b.dataset.info),{onPick, back:()=>openPicker(onPick,n)}); }); };
  $('#exq').oninput=e=>{ state.q=e.target.value; draw(); };
  document.querySelectorAll('[data-tab]').forEach(c=>c.onclick=()=>{ state.tab=c.dataset.tab; document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===c)); draw(); });
  $('#newCustom').onclick=()=>openCustomForm(null, e=>{ onPick(e); });
  draw();
}

function openDetail(e, opts={}){
  if(!e) return;
  const foot=[
    opts.back?`<button class="btn" id="dBack">‹ Terug</button>`:'',
    e.custom?`<button class="btn" id="dEdit">✎ Bewerken</button>`:`<button class="btn" id="dCopy">⎘ Kopie als eigen oefening</button>`,
    opts.onPick?`<button class="btn primary" id="dPick">Toevoegen</button>`:'',
    opts.onSwap?`<button class="btn primary" id="dSwap">Vervangen door andere…</button>`:'',

  if(q('dBack')) q('dBack').onclick=opts.back;
  if(q('dPick')) q('dPick').onclick=()=>{ closeSheet(); opts.onPick(e); };
  if(q('dSwap')) q('dSwap').onclick=()=>openPicker(opts.onSwap, opts.n);
  if(q('dEdit')) q('dEdit').onclick=()=>openCustomForm(e, ()=>{ render(); });
  if(q('dCopy')) q('dCopy').onclick=()=>openCustomForm({...e, id:undefined, name:e.name+' (aangepast)', custom:true}, ne=>{ if(opts.onPick){ opts.onPick(ne); } else render(); });
}

/* ---------- eigen oefening ---------- */
function openCustomForm(e, done){
  const isEdit=!!(e&&e.id&&e.custom);
  e=e||{};
  sheet(`<h2>${isEdit?'Oefening bewerken':'Eigen oefening'}</h2>`,`<div class="form">
    <label class="field">Naam<input id="cName" value="${esc(e.name||'')}" placeholder="bv. Schatkist-dribbel"></label>
    <div class="two">
      <label class="field">Categorie<select id="cCat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${(e.cat||'dribbel')===k?' selected':''}>${v.short}</option>`).join('')}</select></label>
      <label class="field">Duur (min)<input id="cDur" type="number" inputmode="numeric" min="1" max="60" value="${e.dur||10}"></label>
    </div>
    <div class="two">
      <label class="field">Min. spelers<input id="cMin" type="number" inputmode="numeric" min="1" value="${e.players?e.players[0]:4}"></label>
      <label class="field">Max. spelers<input id="cMax" type="number" inputmode="numeric" min="1" value="${e.players?e.players[1]:15}"></label>
    </div>
    <label class="field">Opstelling<textarea id="cOrg" placeholder="Veld, doeltjes, hoedjes, waar staat wie…">${esc(e.org||'')}</textarea></label>
    <label class="field">Zo speel je het (één regel per stap)<textarea id="cDesc" rows="5" placeholder="Stap 1…&#10;Stap 2…">${esc((e.desc||[]).join('\n'))}</textarea></label>
    <label class="field">Materiaal<input id="cMat" value="${esc(e.mat||'')}" placeholder="bv. 1 bal per kind, 8 hoedjes, 2 doeltjes"></label>
    <div class="two">
      <label class="field">Makkelijker<input id="cEasy" value="${esc(e.easier||'')}"></label>
      <label class="field">Moeilijker<input id="cHard" value="${esc(e.harder||'')}"></label>
    </div>
  </div>`,`${isEdit?`<button class="btn danger" id="cDel">Verwijderen</button>`:''}<span class="grow"></span><button class="btn primary" id="cSave">${isEdit?'Opslaan':'Opslaan en gebruiken'}</button>`);
  $('#cSave').onclick=async()=>{
    const name=$('#cName').value.trim(); if(!name){ $('#cName').focus(); return; }
    const ne={id:isEdit?e.id:'c_'+uid(), custom:true, name, cat:$('#cCat').value, dur:Math.max(1,Number($('#cDur').value)||10), players:[Number($('#cMin').value)||1, Number($('#cMax').value)||15], org:$('#cOrg').value.trim(), desc:$('#cDesc').value.split('\n').map(s=>s.trim()).filter(Boolean), mat:$('#cMat').value.trim(), easier:$('#cEasy').value.trim(), harder:$('#cHard').value.trim()};
    const list=state.lib.exercises||(state.lib.exercises=[]);
    const i=list.findIndex(x=>x.id===ne.id); if(i>=0) list[i]=ne; else list.push(ne);
    closeSheet(); await saveLib(); toast(isEdit?'Oefening bijgewerkt':'Oefening toegevoegd aan de bibliotheek'); done&&done(ne);
  };
  const del=$('#cDel'); if(del) del.onclick=async()=>{ if(!confirm('"'+e.name+'" verwijderen uit de bibliotheek? Trainingen die ze gebruiken tonen dan "(oefening verwijderd)".')) return; state.lib.exercises=state.lib.exercises.filter(x=>x.id!==e.id); closeSheet(); await saveLib(); render(); };
  setTimeout(()=>$('#cName').focus(),50);
}

/* ---------- vrije tekst in een blok ---------- */
function openTextEdit(block, item){
  const isNew=!block;
  const it=item||{};
  sheet(`<h2>${isNew?'Vrije tekst':'Onderdeel bewerken'}</h2>`,`<div class="form">
    <label class="field">Titel<input id="tTitle" value="${esc(it.title||'')}" placeholder="bv. Verjaardag Lucas: zingen"></label>
    ${isNew?`<label class="field">Duur (min)<input id="tDur" type="number" inputmode="numeric" min="1" value="5"></label>`:''}
    <p class="small muted" style="margin:0">Tip: wil je de oefening ook een volgende keer gebruiken? Maak ze dan aan als <b>eigen oefening</b> in de kiezer.</p>
  </div>`,`<button class="btn primary" id="tSave">Opslaan</button>`);
  $('#tSave').onclick=()=>{ const title=$('#tTitle').value.trim(); if(!title) return; closeSheet();
    if(isNew) mutate(t=>{ t.blocks.push({id:uid(), kind:'single', duration:Math.max(1,Number($('#tDur').value)||5), items:[{ex:null, title, coach:''}], note:''}); });
    else mutate(t=>{ it.title=title; it.ex=null; }); };
  setTimeout(()=>$('#tTitle').focus(),50);
}

/* ---------- instellingen ---------- */
function openSettings(){
  const s=state.lib.settings||{};
  sheet(`<h2>Instellingen</h2>`,`<div class="form">
    <label class="field">Trainers (één per regel)<textarea id="sTrainers" rows="4" placeholder="Seb&#10;Tom&#10;An">${esc(trainers().join('\n'))}</textarea></label>
    <label class="field">Clubnaam / ploeg (optioneel)<input id="sClub" value="${esc(s.club||'')}" placeholder="bv. KFC Essen U7"></label>
    <div class="two">
      <label class="field">Vaste trainingsdag<select id="sWeekday"><option value="">— geen</option>${['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'].map((n,i)=>`<option value="${i}"${String(s.defaultWeekday)===String(i)?' selected':''}>${n}</option>`).join('')}</select></label>
      <label class="field">Standaard startuur<input id="sTime" type="time" value="${esc(s.defaultTime||'')}"></label>
    </div>
    <label class="field">Standaard aantal spelers<input id="sPlayers" type="number" inputmode="numeric" value="${esc(s.defaultPlayers||12)}"></label>
    <p class="small muted" style="margin:0">Deze instellingen gelden voor iedereen die de link gebruikt. Er is geen login: deel de link enkel met de trainers.</p>
  </div>`,`<button class="btn primary" id="sSave">Opslaan</button>`);
  $('#sSave').onclick=async()=>{
    state.lib.trainers=$('#sTrainers').value.split('\n').map(x=>x.trim()).filter(Boolean);
    state.lib.settings={...s, club:$('#sClub').value.trim(), defaultWeekday:$('#sWeekday').value===''?null:Number($('#sWeekday').value), defaultTime:$('#sTime').value, defaultPlayers:Number($('#sPlayers').value)||12, defaultTarget:60};
    closeSheet(); await saveLib(); toast('Instellingen opgeslagen'); render();
  };
}
$('#navSettings').onclick=openSettings;

/* ---------- bibliotheekpagina ---------- */
function renderLib(app){
  const chips=`<div class="chips"><button class="chip${!state.tab?' on':''}" data-tab="">Alles</button>${Object.entries(CATS).map(([k,v])=>`<button class="chip${state.tab===k?' on':''}" data-tab="${k}">${v.short}</button>`).join('')}</div>`;
  app.innerHTML=`<div class="pagehead"><h1>Oefeningen</h1><button class="btn primary" id="libNew">＋ Eigen oefening</button></div>
  <input class="search" id="libq" placeholder="Zoeken…" value="${esc(state.q)}">${chips}<div class="libgrid" id="libList"></div>
  <p class="small muted" style="margin-top:16px">De basisoefeningen zijn geïnspireerd op de KNVB Rinus-oefenstof voor O6/O7 op een kwartveld en in eigen woorden samengevat. Elke oefening linkt naar de originele tekening en video. Eigen oefeningen (label "eigen") zijn voor iedereen met de link zichtbaar en aanpasbaar.</p>`;
  const draw=()=>{ const list=filterEx(); $('#libList').innerHTML=list.map(e=>exRow(e,'',state.t?Number(state.t.players)||0:0)).join('')||'<div class="empty">Niets gevonden.</div>'; $('#libList').querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>openDetail(getEx(b.dataset.ex))); };
  $('#libq').oninput=e=>{ state.q=e.target.value; draw(); };
  app.querySelectorAll('[data-tab]').forEach(c=>c.onclick=()=>{ state.tab=c.dataset.tab; app.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===c)); draw(); });
  $('#libNew').onclick=()=>openCustomForm(null, ()=>render());
  draw();
}

/* ---------- overzicht / print ---------- */
function renderPrint(app){
  const t=state.t; if(!t){ app.innerHTML='<div class="empty">Laden…</div>'; return; }
  const nt=nextTraining();
  let cur=0; const used=new Map();
  const rows=(t.blocks||[]).map(b=>{
    const start=nt.time?addMin(nt.time,cur):(cur+"'"); const end=nt.time?addMin(nt.time,cur+(Number(b.duration)||0)):((cur+(Number(b.duration)||0))+"'"); cur+=Number(b.duration)||0;
    b.items.forEach(it=>{ const e=it.ex&&getEx(it.ex); if(e&&!used.has(e.id)) used.set(e.id,e); });
    let what, who;
    if(b.kind==='stations'){
      const per=b.rotate&&b.items.length?Math.round((b.duration||0)/b.items.length):null;
      what=`<b>Stations</b>${per?` <span class="muted small">(doorschuiven om de ${per} min)</span>`:''}${b.items.map((it,j)=>{ const w=fits(getEx(it.ex), playersFor(b,t)); return `<span class="st"><b>${String.fromCharCode(65+j)}</b> <span class="${w?'warn':''}">${esc(exName(it))||'—'}</span>${it.coach?` <span class="muted">· ${esc(it.coach)}</span>`:''}${w?` <span class="warnnote">⚠ ${esc(w)}</span>`:''}</span>`; }).join('')}`;
      who=b.items.map(it=>it.coach).filter(Boolean).join(', ');
    }else{ const w=fits(getEx(b.items[0].ex), playersFor(b,t)); what=`<b class="${w?'warn':''}">${esc(exName(b.items[0]))}</b>${w?`<span class="warnnote">⚠ ${esc(w)}</span>`:''}`; who=b.items[0].coach||''; }
    return `<tr><td class="t">${start}<br><span class="muted small">${end}</span></td><td>${what}${b.note?`<div class="small muted">${esc(b.note)}</div>`:''}</td><td>${b.duration||0}'</td><td>${esc(who)}</td></tr>`;
  }).join('');
  const tot=totals(t);
  const s=state.lib.settings||{};
  app.innerHTML=`<div class="pagehead noprint"><a class="btn sm" href="#/">‹ Bewerken</a><span class="grow"></span><button class="btn sm" onclick="window.print()">🖨 Afdrukken / PDF</button><button class="btn sm" id="shareBtn">↗ Delen</button></div>
  <div class="card ov">
    <h1>${esc(t.title||('Training U7'+(s.club?' · '+s.club:'')))}</h1>
    <div class="muted">${esc(nt.label)} · ${t.players||'?'} spelers · <b class="minutes${tot>(t.target||60)?' over':''}">${tot} min</b> · trainers: ${esc(trainers().join(', '))||'—'}</div>
    <div style="margin-top:8px"><b class="small">Materiaal klaarzetten:</b> ${matHtml(t)}</div>
    <table><thead><tr><th>Tijd</th><th>Onderdeel</th><th>Duur</th><th>Uitleg</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted">Nog geen onderdelen.</td></tr>'}</tbody></table>
    ${used.size?`<h2 style="font-size:16px;margin-top:22px">Oefeningen in het kort</h2>`+[...used.values()].map(e=>`<div class="exd"><h3>${esc(e.name)} <span class="muted small">· ${e.dur} min · ${e.players?e.players[0]+'–'+e.players[1]:'?'} sp.</span></h3>${e.org?`<p>${esc(e.org)}</p>`:''}<ul>${(e.desc||[]).map(d=>`<li>${esc(d)}</li>`).join('')}</ul>${e.mat?`<p>Materiaal: ${esc(e.mat)}</p>`:''}</div>`).join(''):''}
  </div>`;
  $('#shareBtn').onclick=async()=>{ const url=location.origin+location.pathname; try{ if(navigator.share) await navigator.share({title:t.title||'Training U7', url}); else { await navigator.clipboard.writeText(url); toast('Link gekopieerd'); } }catch(e){} };
}

/* ---------- start ---------- */
(async function init(){
  try{ state.lib=await api('/library'); }catch(e){ toast('Bibliotheek laden mislukt: '+e.message,true); }
  route();
  // Terug in beeld (bv. telefoon ontgrendeld): datum/uur herberekenen en verse versie ophalen.
  document.addEventListener('visibilitychange',async()=>{ if(document.hidden||!state.t||state.dirty||state.saving) return; try{ const r=await api('/trainings/'+CURRENT_ID); if(r.version!==state.t.version) state.t=r; }catch(e){} render(); });
})();
</script>
</body>
</html>
